<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A web application for dictation practice and vocabulary building with text-to-speech.">
    <title>Dictation Practice App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/pinyin/dist/pinyin.js"></script>
</head>
<body>
    <div class="theme-switcher">
        <label for="theme-select">Theme:</label>
        <select id="theme-select">
            <option value="default">Default</option>
            <option value="dark-mode">Dark Mode</option>
            <option value="forest">Forest</option>
            <option value="marine">Marine</option>
            <option value="creative">Creative</option>
            <option value="cartoon">Cartoon</option>
        </select>
    </div>

    <main class="main-content">
        <div class="container">
            <h1>Dictation Practice</h1>
            <p>Enter your vocabulary below, then use the controls to start your practice session.</p>
            <p id="status" class="status-message"></p>

            <div class="settings-grid">
                <div class="form-group">
                    <label for="voice-select">Voice</label>
                    <select id="voice-select"></select>
                </div>
                <div class="form-group">
                    <label for="rate-slider">
                        <span>Rate</span>
                        <span id="rate-value-display" class="slider-value-display">1.0x</span>
                    </label>
                    <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1">
                </div>
                <div class="form-group">
                    <label for="pitch-slider">
                        <span>Pitch</span>
                        <span id="pitch-value-display" class="slider-value-display">1.0</span>
                    </label>
                    <input type="range" id="pitch-slider" min="0" max="2" step="0.1" value="1">
                </div>
            </div>

            <div class="input-section">
                <div id="multi-input-container">
                    <!-- JS will populate this -->
                </div>
        
                <div class="add-button-container">
                    <button id="add-button" type="button" title="Add a new input line">+</button>
                </div>
            </div>

            <div class="list-actions">
                <button id="speak-button">Start Dictation</button>
                <button id="shuffle-button">Shuffle</button>
                <button id="read-all-button">Read All</button>
                <button id="show-answers-button">Show Answers</button>
                <button id="export-button">Export as .txt</button>
                <button id="reset-button">Reset</button>
            </div>

            <div class="feedback-link-container">
                <a href="#" id="feedback-link">Send Feedback</a>
            </div>

            <!-- Version Information -->
            <div class="version-info-container">
                Copyright &copy; LWC | Version: 250817
            </div>
        </div>
    </main>

    <!-- Feedback Modal -->
    <div id="feedback-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close-btn">&times;</span>
            <h2>Send Feedback</h2>
            <p>Have a suggestion or found a bug? Let me know!</p>
            <textarea id="feedback-textarea" rows="5" placeholder="Your feedback..."></textarea>
            <button id="send-feedback-btn">Send via Email</button>
        </div>
    </div>

    <!-- Meaning Modal -->
    <div id="meaning-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close-btn">&times;</span>
            <div id="meaning-text"></div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
