<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dictation practice with Cantonese and English text-to-speech.">
    <title>聽寫練習</title>
    <link rel="stylesheet" href="style.css?v=260921k">
    <link rel="stylesheet" href="lang.css?v=260921k">
    <link rel="stylesheet" href="paintings.css?v=260921k">
    <link rel="stylesheet" href="ui-fix.css?v=260921k">
    <script src="https://cdn.jsdelivr.net/npm/pinyin/dist/pinyin.js"></script>
</head>
<body>
    <button type="button" id="ui-lang-toggle" class="ui-lang-toggle" aria-label="Switch language">
        <span class="ui-lang-knob"></span>
        <span class="ui-lang-zh">中</span>
        <span class="ui-lang-en">Eng</span>
    </button>
    <div class="theme-switcher">
        <label for="theme-select" data-i18n="themeLabel">主題</label>
        <select id="theme-select">
            <optgroup label="色彩 Colours">
                <option value="default" data-zh="天青" data-en="Sky">天青</option>
                <option value="dark-mode" data-zh="夜間" data-en="Night">夜間</option>
                <option value="sunset" data-zh="日落" data-en="Sunset">日落</option>
                <option value="peach" data-zh="蜜桃" data-en="Peach">蜜桃</option>
                <option value="candy" data-zh="糖果" data-en="Candy">糖果</option>
                <option value="lemon" data-zh="檸檬" data-en="Lemon">檸檬</option>
                <option value="matcha" data-zh="抹茶" data-en="Matcha">抹茶</option>
                <option value="forest" data-zh="森林" data-en="Forest">森林</option>
                <option value="marine" data-zh="海洋" data-en="Ocean">海洋</option>
                <option value="grape" data-zh="葡萄" data-en="Grape">葡萄</option>
                <option value="lava" data-zh="熔岩" data-en="Lava">熔岩</option>
                <option value="night-sky" data-zh="星空" data-en="Galaxy">星空</option>
                <option value="creative" data-zh="紫霓" data-en="Aurora">紫霓</option>
                <option value="cartoon" data-zh="卡通" data-en="Cartoon">卡通</option>
            </optgroup>
            <optgroup label="名畫 Paintings">
                <option value="art-sunrise" data-zh="莫奈·日出" data-en="Sunrise">莫奈·日出</option>
                <option value="art-lilies" data-zh="莫奈·睡蓮" data-en="Lilies">莫奈·睡蓮</option>
                <option value="art-starry" data-zh="梵高·星夜" data-en="Starry Night">梵高·星夜</option>
                <option value="art-sun" data-zh="梵高·向日葵" data-en="Sunflowers">梵高·向日葵</option>
                <option value="art-pearl" data-zh="珍珠耳環" data-en="Pearl Earring">珍珠耳環</option>
                <option value="art-wave" data-zh="北齋·巨浪" data-en="Great Wave">北齋·巨浪</option>
                <option value="art-kiss" data-zh="克林姆·吻" data-en="The Kiss">克林姆·吻</option>
                <option value="art-venus" data-zh="維納斯" data-en="Venus">維納斯</option>
                <option value="art-cezanne" data-zh="塞尚·聖山" data-en="Sainte-Victoire">塞尚·聖山</option>
            </optgroup>
        </select>
    </div>
    <main class="main-content">
        <div class="container">
            <h1 data-i18n="title">聽寫練習</h1>
            <p data-i18n="subtitle">輸入詞語，然後開始練習。</p>
            <div class="daily-quote" id="daily-quote">
                <p class="daily-quote-text" id="daily-quote-text"></p>
                <p class="daily-quote-by" id="daily-quote-by"></p>
                <div class="daily-quote-nav">
                    <button type="button" id="quote-prev" class="quote-nav-btn" aria-label="Previous quote">&lt;</button>
                    <button type="button" id="quote-next" class="quote-nav-btn" aria-label="Next quote">&gt;</button>
                </div>
            </div>
            <p id="status" class="status-message"></p>
            <div class="settings-grid">
                <div class="lang-chips" hidden>
                    <button type="button" class="lang-chip" id="lang-yue" data-lang="yue">廣東話</button>
                    <button type="button" class="lang-chip" id="lang-cmn" data-lang="cmn">普通話</button>
                    <button type="button" class="lang-chip" id="lang-en" data-lang="en">英語</button>
                </div>
                <p id="voice-hint" class="voice-hint"></p>
                <div class="form-group">
                    <label for="voice-select" data-i18n="voiceLabel">語音</label>
                    <select id="voice-select"></select>
                </div>
                <div class="form-group">
                    <label for="rate-slider">
                        <span data-i18n="speedLabel">速度</span>
                        <span id="rate-value-display" class="slider-value-display">1.0x</span>
                    </label>
                    <input type="range" id="rate-slider" min="0.1" max="2" step="0.1" value="1">
                </div>
                <div class="form-group">
                    <label for="pitch-slider">
                        <span data-i18n="pitchLabel">音調</span>
                        <span id="pitch-value-display" class="slider-value-display">1.0</span>
                    </label>
                    <input type="range" id="pitch-slider" min="0" max="2" step="0.1" value="1">
                </div>
            </div>
            <div class="input-section">
                <div id="multi-input-container"></div>
                <div class="add-button-container">
                    <button id="add-button" type="button" title="+">+</button>
                </div>
            </div>
            <div class="list-actions">
                <button id="speak-button" data-i18n="btnStart">開始聽寫</button>
                <button id="shuffle-button" data-i18n="btnShuffle">打亂</button>
                <button id="read-all-button" data-i18n="btnReadAll">全部朗讀</button>
                <button id="show-answers-button" data-i18n="btnAnswers">顯示答案</button>
                <button id="export-button" data-i18n="btnExport">匯出</button>
                <button id="reset-button" data-i18n="btnReset">重設</button>
            </div>
            <div class="feedback-link-container">
                <a href="#" id="feedback-link" data-i18n="feedback">意見回饋</a>
            </div>
            <div class="version-info-container">Copyright &copy; LWC | Version: 260921k</div>
        </div>
    </main>
    <div id="feedback-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close-btn">&times;</span>
            <h2 data-i18n="feedbackTitle">意見回饋</h2>
            <p data-i18n="feedbackBody">有建議或發現問題？請告訴我。</p>
            <textarea id="feedback-textarea" rows="5" data-i18n-placeholder="feedbackPh" placeholder="你的意見…"></textarea>
            <button id="send-feedback-btn" data-i18n="feedbackSend">以電郵傳送</button>
        </div>
    </div>
    <div id="meaning-modal" class="modal-overlay">
        <div class="modal-content meaning-card">
            <span class="modal-close-btn">&times;</span>
            <div id="meaning-text"></div>
        </div>
    </div>
    <script src="script.js" defer></script>
    <script src="ui-i18n.js?v=260921k" defer></script>
    <script src="voices-fix.js?v=260921k" defer></script>
    <script src="meaning-plus.js?v=260921k" defer></script>
    <script src="theme-fix.js?v=260921k" defer></script>
    <script src="daily-quote.js?v=260921k" defer></script>
</body>
</html>
