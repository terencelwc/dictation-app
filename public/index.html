<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A web application for dictation practice and vocabulary building with text-to-speech.">
    <title>聽寫練習 Dictation Practice</title>
    <link rel="stylesheet" href="style.css?v=260920c">
    <link rel="stylesheet" href="lang.css?v=260920c">
    <script src="https://cdn.jsdelivr.net/npm/pinyin/dist/pinyin.js"></script>
</head>
<body>
    <div class="theme-switcher">
        <label for="theme-select">主題 Theme:</label>
        <select id="theme-select">
            <option value="default">天蒼 Sky</option>
            <option value="dark-mode">夜間 Night</option>
            <option value="sunset">日落 Sunset</option>
            <option value="peach">蜜桃 Peach</option>
            <option value="candy">糖果 Candy</option>
            <option value="lemon">檸檬 Lemon</option>
            <option value="matcha">抹茶 Matcha</option>
            <option value="forest">森林 Forest</option>
            <option value="marine">海洋 Ocean</option>
            <option value="grape">葡萄 Grape</option>
            <option value="lava">熔岩 Lava</option>
            <option value="night-sky">星空 Galaxy</option>
            <option value="creative">紫霓 Aurora</option>
            <option value="cartoon">卡通 Cartoon</option>
        </select>
    </div>

    <main class="main-content">
        <div class="container">
            <h1>聽寫練習 Dictation Practice</h1>
            <p>輸入詞語（廣東話或英語），然後開始練習。<br>Enter Cantonese or English words, then start practice.</p>
            <p id="status" class="status-message"></p>

            <div class="settings-grid">
                <div class="lang-chips" role="group" aria-label="Language">
                    <button type="button" class="lang-chip" id="lang-yue" data-lang="yue">廣東話 Cantonese</button>
                    <button type="button" class="lang-chip" id="lang-en" data-lang="en">英語 English</button>
                </div>
                <p id="voice-hint" class="voice-hint"></p>
                <div class="form-group">
                    <label for="voice-select">語音 Voice</label>
                    <select id="voice-select"></select>
                </div>
                <div class="form-group">
                    <label for="rate-slider">
                        <span>速度 Speed</span>
                        <span id="rate-value-display" class="slider-value-display">1.0x</span>
                    </label>
                    <input type="range" id="rate-slider" min="0.1" max="2" step="0.1" value="1">
                </div>
                <div class="form-group">
                    <label for="pitch-slider">
                        <span>音調 Pitch</span>
                        <span id="pitch-value-display" class="slider-value-display">1.0</span>
                    </label>
                    <input type="range" id="pitch-slider" min="0" max="2" step="0.1" value="1">
                </div>
            </div>

            <div class="input-section">
                <div id="multi-input-container"></div>
                <div class="add-button-container">
                    <button id="add-button" type="button" title="Add a new input line">+</button>
                </div>
            </div>

            <div class="list-actions">
                <button id="speak-button">開始聽寫 Start</button>
                <button id="shuffle-button">打亂 Shuffle</button>
                <button id="read-all-button">全部朗讀 Read all</button>
                <button id="show-answers-button">顯示答案 Answers</button>
                <button id="export-button">匯出 Export</button>
                <button id="reset-button">重設 Reset</button>
            </div>

            <div class="feedback-link-container">
                <a href="#" id="feedback-link">Send Feedback</a>
            </div>

            <div class="version-info-container">
                Copyright &copy; LWC | Version: 260920c
            </div>
        </div>
    </main>

    <div id="feedback-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close-btn">&times;</span>
            <h2>Send Feedback</h2>
            <p>Have a suggestion or found a bug? Let me know!</p>
            <textarea id="feedback-textarea" rows="5" placeholder="Your feedback..."></textarea>
            <button id="send-feedback-btn">Send via Email</button>
        </div>
    </div>

    <div id="meaning-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close-btn">&times;</span>
            <div id="meaning-text"></div>
        </div>
    </div>

    <script src="script.js" defer></script>
    <script src="voices-fix.js" defer></script>
    <script src="theme-fix.js?v=260920c" defer></script>
</body>
</html>
